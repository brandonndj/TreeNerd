version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # wrangler declares a minimum workers-types version, so they must move together
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
  - package-ecosystem: pip
    directory: /pipeline
    schedule: { interval: weekly }
