name: Data pipeline

# Fetch sources, enrich, build tiles and publish to Cloudflare.
on:
  schedule:
    - cron: "23 18 * * 0" # weekly
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started
        required: false
        default: manual
      skip_upload:
        description: Build only, don't publish
        type: boolean
        default: false

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to report a failed update

env:
  TIPPECANOE_VERSION: "2.79.0"
  TIPPECANOE_SHA: 68ab8dcc229f95b8b25877697d5e8d66783af503
  R2_BUCKET: trees-data
  D1_DATABASE: trees
  # Only publish from main; runs on other branches build and stop.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event.inputs.skip_upload != 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install --require-hashes -r pipeline/requirements.lock

      - name: Cache tippecanoe
        id: tippecanoe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tippecanoe
          key: tippecanoe-${{ env.TIPPECANOE_SHA }}-${{ runner.os }}
      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tc
          test "$(git -C /tmp/tc rev-parse HEAD)" = "$TIPPECANOE_SHA"
          make -C /tmp/tc -j"$(nproc)"
          mkdir -p ~/tippecanoe && cp /tmp/tc/tippecanoe /tmp/tc/tile-join ~/tippecanoe/
      - run: echo "$HOME/tippecanoe" >> "$GITHUB_PATH"

      - name: Fetch sources
        env:
          DATAGOVSG_API_KEY: ${{ secrets.DATAGOVSG_API_KEY }}
        run: python -m pipeline.fetch all

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PUBLISH == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.PUBLISH == 'true'
        run: npm ci --ignore-scripts

      - name: Get the previous build (to list trees added and removed since)
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          get() {
            for attempt in 1 2 3; do
              npx wrangler r2 object get "$R2_BUCKET/$1" --file "build/raw/$2" --remote > /dev/null 2>&1 && return 0
              sleep $((attempt * 5))
            done
            rm -f "build/raw/$2"; echo "no previous $1"
          }
          get trees.csv.gz prev_trees.csv.gz
          get meta.json prev_meta.json
          get changes.json prev_changes.json

      - name: Build
        run: python -m pipeline.build

      - name: Accuracy audit
        # Re-counts every figure from the tree table and compares a sample of trees with NParks'
        # live records. A failure stops here: nothing is published.
        run: python -m pipeline.audit

      - name: Build vector tiles
        run: |
          tippecanoe -o build/out/trees.pmtiles --force -P \
            -l trees -n "TreeNerd" -A "Trees.sg © NParks" \
            -Z10 -z16 -B15 -r2 \
            --drop-densest-as-needed --extend-zooms-if-still-dropping \
            build/out/trees.geojsonl
          ls -lh build/out

      - name: Summary
        env:
          REASON: ${{ github.event.inputs.reason || github.event_name }}
        run: |
          {
            echo "### TreeNerd data build"
            echo '```json'
            cat build/out/meta.json
            echo '```'
            printf 'Reason: %s\n' "${REASON:0:200}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-summary
          path: build/out/meta.json
          retention-days: 14

      - name: Load the idle database
        id: load
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Two databases take turns so visitors never query one that's mid-load.
          npx wrangler r2 object get "$R2_BUCKET/active-db" --file build/out/active-db.live --remote > /dev/null 2>&1 || true
          ACTIVE=$(cat build/out/active-db.live 2>/dev/null | tr -d "[:space:]"); ACTIVE=${ACTIVE:-a}
          case "$ACTIVE" in a|b) ;; *) echo "unexpected active-db value: '$ACTIVE'"; exit 1;; esac
          if [ "$ACTIVE" = "b" ]; then TARGET=trees; NEXT=a; else TARGET=trees-b; NEXT=b; fi
          echo "Live database: ${ACTIVE:-a}; loading $TARGET"
          for f in build/out/d1/*.sql; do
            echo "::group::$(basename "$f")"
            for attempt in 1 2 3; do
              npx wrangler d1 execute "$TARGET" --remote --yes --file "$f" > /dev/null && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 15))
            done
            echo "::endgroup::"
          done
          # Verify before switching: the database must hold exactly what the build produced,
          # and the build marker (written last) must be there.
          python - "$TARGET" <<'PY'
          import json, subprocess, sys
          target = sys.argv[1]
          meta = json.load(open("build/out/meta.json"))
          def one(sql):
              out = subprocess.run(["npx", "wrangler", "d1", "execute", target, "--remote", "--json", "--command", sql],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)[0]["results"][0]
          got = one("SELECT (SELECT count(*) FROM trees) trees, (SELECT count(*) FROM species) species, "
                    "(SELECT count(*) FROM places) places, (SELECT value FROM meta WHERE key='build') build")
          want = {"trees": meta["tree_count"], "species": meta["species_count"], "places": sum(meta["place_counts"].values())}
          print("loaded:", {k: got[k] for k in want}, "expected:", want)
          assert {k: got[k] for k in want} == want, "row counts differ from the build"
          assert got["build"] and json.loads(got["build"])["built_at"] == meta["built_at"], "build marker missing or wrong"
          PY
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish the files that belong to this database
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT: ${{ steps.load.outputs.next }}
        run: |
          # Tiles, search index and species list are stored per database ("-a" / "-b"), so the site
          # switches to all of them at once and a rollback brings back a matching set.
          put() { npx wrangler r2 object put "$R2_BUCKET/$1" --file "build/out/$2" --content-type "$3" --remote; }
          put "trees-$NEXT.pmtiles" trees.pmtiles application/vnd.pmtiles
          put "search-$NEXT.json" search.json application/json
          put "species-$NEXT.json" species.json application/json

      - name: Switch the site to the new database
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT: ${{ steps.load.outputs.next }}
        run: |
          printf '%s' "$NEXT" > build/out/active-db
          npx wrangler r2 object put "$R2_BUCKET/active-db" --file build/out/active-db --content-type text/plain --remote
          echo "Live database is now: $NEXT (the previous one is kept as a rollback)"

      - name: Publish the downloads and shared copies
        if: env.PUBLISH == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() { npx wrangler r2 object put "$R2_BUCKET/$1" --file "build/out/$2" --content-type "$3" --remote; }
          put trees.pmtiles trees.pmtiles application/vnd.pmtiles
          put search.json search.json application/json
          put species.json species.json application/json
          put meta.json meta.json application/json
          put trees.csv.gz trees.csv.gz application/gzip
          put "snapshots/$(date -u +%F)/trees.csv.gz" trees.csv.gz application/gzip
          # the rolling change log is only replaced when this build was compared with the previous one
          if [ -f build/raw/prev_trees.csv.gz ]; then put changes.json changes.json application/json; fi

      - name: Check the live site switched
        if: env.PUBLISH == 'true'
        run: |
          WANT=$(python -c "import json;print(json.load(open('build/out/meta.json'))['built_at'])")
          for attempt in $(seq 1 12); do
            GOT=$(curl -fsS -m 20 "https://treenerd.fyi/api/health" | python -c "import json,sys;d=json.load(sys.stdin);print(d['built_at'] if d['ok'] else 'unhealthy')" 2>/dev/null || echo unreachable)
            echo "live build: $GOT (want $WANT)"
            [ "$GOT" = "$WANT" ] && exit 0
            sleep 15
          done
          # "unreachable" can be the site's bot protection refusing this runner; anything else is a real problem
          [ "$GOT" = "unreachable" ] && { echo "::warning::could not reach the live site to confirm the switch"; exit 0; }
          echo "::error::the live site is not serving the new build"; exit 1

      - name: Open an issue if the update failed
        if: failure() && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Data update failed ($(date -u +%F))" \
            --body "The data pipeline run failed, so the site is still showing the previous data. Run: $RUN_URL"
