name: Roll back data

# Switch the site back to the previous data build (the other of its two databases, with the tiles,
# search index and species list that belong to it). Run it again to undo.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "rollback" to confirm
        required: true

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: trees-data

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Switch to the other database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object get "$R2_BUCKET/active-db" --file active-db.live --remote > /dev/null 2>&1 || true
          ACTIVE=$(cat active-db.live 2>/dev/null | tr -d "[:space:]"); ACTIVE=${ACTIVE:-a}
          case "$ACTIVE" in a) NEXT=b; TARGET=trees-b;; b) NEXT=a; TARGET=trees;; *) echo "unexpected active-db value: '$ACTIVE'"; exit 1;; esac
          # refuse to switch to a database that holds no complete build
          BUILD=$(npx wrangler d1 execute "$TARGET" --remote --json --command "SELECT value FROM meta WHERE key='build'" \
            | python3 -c "import json,sys;r=json.load(sys.stdin)[0]['results'];print(json.loads(r[0]['value'])['built_at'] if r else '')")
          [ -n "$BUILD" ] || { echo "::error::$TARGET holds no complete build; not switching"; exit 1; }
          printf '%s' "$NEXT" > active-db
          npx wrangler r2 object put "$R2_BUCKET/active-db" --file active-db --content-type text/plain --remote
          echo "Live database is now: $NEXT (data built $BUILD). The site follows within about 30 seconds." | tee -a "$GITHUB_STEP_SUMMARY"
